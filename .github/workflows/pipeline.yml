name: Pipeline

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install linter
        run: python -m pip install flake8

      - name: Run flake8
        run: flake8 . --max-line-length=100 --exclude=migrations,*/migrations/*,**/migrations/*,__pycache__,build,dist,node_modules
  
  react-lint:
    name: React Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # or 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install client dependencies
        working-directory: Incrementum.client
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        working-directory: Incrementum.client
        run: pnpm run lint

  python-test:
    name: python-tests
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Python test image
        run: docker build -f Incrementum.api/test.Dockerfile -t incrementum-api-test ./Incrementum.api

      - name: Run Python tests
        run: docker run --rm incrementum-api-test

  react-test:
    name: react-tests
    needs: react-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build React test image
        run: docker build -f Incrementum.client/Dockerfile.test -t incrementum-client-test ./Incrementum.client

      - name: Run React tests
        run: docker run --rm -e CI=true incrementum-client-test

  push-docker:
    name: Push to Docker Hub
    needs: [python-test, react-test]
    runs-on: ubuntu-latest
    # if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v4
        with:
          context: ./Incrementum.api
          file: ./Incrementum.api/Dockerfile
          push: true
          tags: |
            nhowell02/incrementum_api:latest
            nhowell02/incrementum_api:${{ github.sha }}

      - name: Build and push Client image
        uses: docker/build-push-action@v4
        with:
          context: ./Incrementum.client
          file: ./Incrementum.client/Dockerfile
          push: true
          tags: |
            nhowell02/incrementum_client:latest
            nhowell02/incrementum_client:${{ github.sha }}

  deploy-kubernetes:
    name: Deploy to Kubernetes
    needs: push-docker
    runs-on: [self-hosted]
    # if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

      - name: Substitute environment variables
        env:
          IMAGE_TAG: ${{ github.sha }}
          DEBUG: "False"
          CSRF_TRUSTED_ORIGINS: "https://api.incremy.duckdns.org,https://incremy.duckdns.org"
          CORS_ALLOWED_ORIGINS: "https://incremy.duckdns.org"
          ALLOWED_HOSTS: "api.incremy.duckdns.org,api,localhost,127.0.0.1"
          DATABASE_NAME: "Incr_DB"
          DATABASE_USER: "Incr"
          DATABASE_HOST: "db"
          DATABASE_PORT: "5432"
          KEYCLOAK_CLIENT_ID: "incrementum-client"
          VITE_API_BASE_URL: "https://api.incremy.duckdns.org"
          VITE_DASH_BASE_URL: "https://api.incremy.duckdns.org:8050"
        run: |
          for file in kubernetes/*.yaml; do
            envsubst < "$file" > "${file}.tmp"
            mv "${file}.tmp" "$file"
          done

      - name: Apply Kubernetes manifests
        run: kubectl apply -f kubernetes/

      - name: Upsert DB connection string secret
        env:
          DB_CONN_STRING: ${{ secrets.DB_CONN_STRING }}
        run: |
          set -e

          if [[ -z "$DB_CONN_STRING" ]]; then
            echo "Missing required GitHub secret: DB_CONN_STRING"
            exit 1
          fi

          kubectl create secret generic incrementum-secrets \
            --namespace=incrementum \
            --from-literal=db-conn-string="$DB_CONN_STRING" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Preflight API secret keys
        run: |
          set -e

          SECRET_NAME="incrementum-secrets"
          REQUIRED_KEYS=(
            "django-secret-key"
            "db-conn-string"
          )

          kubectl get secret "$SECRET_NAME" -n incrementum >/dev/null

          for key in "${REQUIRED_KEYS[@]}"; do
            value="$(kubectl get secret "$SECRET_NAME" -n incrementum -o go-template="{{index .data \"$key\"}}" 2>/dev/null || true)"
            if [[ -z "$value" ]]; then
              echo "Missing required key '$key' in secret '$SECRET_NAME' (namespace incrementum)."
              echo "Current keys:"
              kubectl get secret "$SECRET_NAME" -n incrementum -o jsonpath='{.data}'
              echo
              exit 1
            fi
          done

          echo "Secret preflight passed for $SECRET_NAME"

      - name: Restart deployments to pick up config changes
        run: |
          kubectl rollout restart deployment/incrementum-api -n incrementum
          kubectl rollout restart deployment/incrementum-client -n incrementum
